<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useRef } = React;
const {
  Sun, Moon, Dumbbell, CheckCircle2, Circle, Linkedin, Youtube, Wrench,
  DollarSign, Plus, Trash2, TrendingUp, Clock, X, Sparkles, Send, Loader2,
  LayoutGrid, AlertCircle, Download, Upload, ShieldCheck
} = lucide;

/* ============================== STORAGE (localStorage) ============================== */
const KEY = "operator-dashboard-state-v3";

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}
function timeAgo(iso) {
  if (!iso) return "never";
  const diff = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + "h ago";
  return Math.floor(hrs / 24) + "d ago";
}
function pushLog(state, message) {
  const entry = { id: "log" + Date.now() + Math.random(), message, ts: new Date().toISOString() };
  return [entry, ...(state.activityLog || [])].slice(0, 60);
}
function touch(state, section) {
  return { ...state, lastUpdated: { ...(state.lastUpdated || {}), [section]: new Date().toISOString() } };
}

const defaultState = {
  date: todayStr(),
  energy: null,
  mits: [
    { id: "m1", text: "", done: false },
    { id: "m2", text: "", done: false },
    { id: "m3", text: "", done: false },
  ],
  gymDone: false,
  wins: ["", "", ""],
  linkedinQueue: [
    { id: "li1", week: 1, day: "Tue", topic: "Intro post — the 8 week plan", status: "queued" },
    { id: "li2", week: 1, day: "Thu", topic: "Problem post — missed calls cost local businesses", status: "queued" },
    { id: "li3", week: 2, day: "Tue", topic: "Lesson post — first 20 cold calls", status: "queued" },
    { id: "li4", week: 2, day: "Thu", topic: "Demo video — MCTB in action", status: "queued" },
  ],
  youtubeQueue: [
    { id: "yt1", week: 4, title: "I Am Building an AI Agency From Zero — Week 1", status: "planned" },
    { id: "yt2", week: 5, title: "How I Set Up a Missed Call Text Back in n8n — Full Demo", status: "planned" },
    { id: "yt3", week: 6, title: "I Discovered My First AIOS Client — A Mechanic Shop", status: "planned" },
  ],
  mechanicProject: {
    phase: "discovery",
    discoveryDone: false,
    notes: "",
    features: [
      { id: "f1", text: "MCTB intake (n8n + Twilio)", done: true },
      { id: "f2", text: "Booking dashboard / job cards", done: false },
      { id: "f3", text: "Customer profile + vehicle history", done: false },
      { id: "f4", text: "Multi-supplier parts search dashboard", done: false },
      { id: "f5", text: "Invoice generator", done: false },
      { id: "f6", text: "Review follow-up agent", done: false },
    ],
  },
  cashflow: { target: 1000, entries: [] },
  clients: [],
  lastUpdated: { today: null, linkedin: null, youtube: null, mechanic: null, cashflow: null },
  activityLog: [],
};

function loadFromLocalStorage() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) {
    return null;
  }
}
function saveToLocalStorage(state) {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    return true;
  } catch (e) {
    console.error("save failed", e);
    return false;
  }
}

function useDashboardState() {
  const [state, setState] = useState(defaultState);
  const [loaded, setLoaded] = useState(false);
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    const parsed = loadFromLocalStorage();
    if (parsed) {
      let merged = { ...defaultState, ...parsed };
      if (merged.date !== todayStr()) {
        merged = {
          ...merged,
          date: todayStr(),
          energy: null,
          gymDone: false,
          mits: [
            { id: "m1", text: "", done: false },
            { id: "m2", text: "", done: false },
            { id: "m3", text: "", done: false },
          ],
          wins: ["", "", ""],
        };
      }
      setState(merged);
    }
    setLoaded(true);
  }, []);

  const persist = useCallback((next) => {
    setSaving(true);
    saveToLocalStorage(next);
    setTimeout(() => setSaving(false), 250);
  }, []);

  const update = useCallback((updater) => {
    setState((prev) => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      persist(next);
      return next;
    });
  }, [persist]);

  return { state, update, setState, loaded, saving };
}

/* ============================== AI PARSER ============================== */
const SYSTEM_PROMPT = "You are a state-update parser for a personal operator dashboard. The user will type a casual, free-text status update describing what happened in their day or business. Your job is to extract structured actions and return ONLY valid JSON, nothing else, no markdown fences, no preamble. Return an object with an actions array. Each action is one of these exact shapes: {type:mit_add,text}, {type:mit_done,matchText}, {type:gym_done}, {type:energy,value(1-10)}, {type:win_add,text}, {type:linkedin_add,topic,week,day(Tue or Thu)}, {type:linkedin_status,matchText,status(queued/drafted/posted)}, {type:youtube_add,title,week}, {type:youtube_status,matchText,status(planned/filmed/live)}, {type:mechanic_phase,phase(discovery/scoping/building/pilot/live)}, {type:mechanic_discovery_done}, {type:mechanic_feature_done,matchText}, {type:mechanic_note,text}, {type:cash_entry,label,amount}, {type:client_add,name,amount}. Only emit actions clearly supported by the text, do not invent data. matchText should be a short distinctive fragment of existing item text to fuzzy match. If the user mentions closing a recurring client with a dollar amount emit both cash_entry and client_add. If nothing maps to an action return actions: []. Output JSON only.";

async function parseUpdateWithClaude(text) {
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json", "anthropic-dangerous-direct-browser-access": "true" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      system: SYSTEM_PROMPT,
      messages: [{ role: "user", content: text }],
    }),
  });
  const data = await response.json();
  let raw = (data.content || []).map((b) => (b.type === "text" ? b.text : "")).join("").trim();
  raw = raw.replace(/^```json\s*/i, "").replace(/^```\s*/i, "").replace(/```\s*$/i, "");
  try {
    return JSON.parse(raw);
  } catch (e) {
    return { actions: [] };
  }
}

function fuzzyMatch(items, matchText, getText) {
  if (!matchText) return null;
  const needle = matchText.toLowerCase();
  return items.find((it) => getText(it).toLowerCase().includes(needle)) || null;
}

function applyActions(state, actions) {
  let s = { ...state };
  const summaries = [];

  for (const a of actions) {
    switch (a.type) {
      case "mit_add": {
        const slot = s.mits.find((m) => !m.text.trim());
        if (slot) {
          s = { ...s, mits: s.mits.map((m) => (m.id === slot.id ? { ...m, text: a.text } : m)) };
          summaries.push("Added MIT: " + a.text);
        }
        break;
      }
      case "mit_done": {
        const m = fuzzyMatch(s.mits, a.matchText, (x) => x.text);
        if (m) {
          s = { ...s, mits: s.mits.map((x) => (x.id === m.id ? { ...x, done: true } : x)) };
          summaries.push("Marked MIT done: " + m.text);
        }
        break;
      }
      case "gym_done":
        s = { ...s, gymDone: true };
        summaries.push("Gym marked done");
        break;
      case "energy":
        s = { ...s, energy: a.value };
        summaries.push("Energy set to " + a.value);
        break;
      case "win_add": {
        const idx = s.wins.findIndex((w) => !w.trim());
        if (idx !== -1) {
          s = { ...s, wins: s.wins.map((w, i) => (i === idx ? a.text : w)) };
          summaries.push("Added win: " + a.text);
        }
        break;
      }
      case "linkedin_add":
        s = {
          ...s,
          linkedinQueue: [
            ...s.linkedinQueue,
            { id: "li" + Date.now() + Math.random(), week: a.week || "-", day: a.day || "-", topic: a.topic, status: "queued" },
          ],
        };
        s = touch(s, "linkedin");
        summaries.push("LinkedIn queued: " + a.topic);
        break;
      case "linkedin_status": {
        const p = fuzzyMatch(s.linkedinQueue, a.matchText, (x) => x.topic);
        if (p) {
          s = { ...s, linkedinQueue: s.linkedinQueue.map((x) => (x.id === p.id ? { ...x, status: a.status } : x)) };
          s = touch(s, "linkedin");
          summaries.push('LinkedIn "' + p.topic.slice(0, 30) + '" -> ' + a.status);
        }
        break;
      }
      case "youtube_add":
        s = {
          ...s,
          youtubeQueue: [...s.youtubeQueue, { id: "yt" + Date.now() + Math.random(), week: a.week || "-", title: a.title, status: "planned" }],
        };
        s = touch(s, "youtube");
        summaries.push("YouTube planned: " + a.title);
        break;
      case "youtube_status": {
        const v = fuzzyMatch(s.youtubeQueue, a.matchText, (x) => x.title);
        if (v) {
          s = { ...s, youtubeQueue: s.youtubeQueue.map((x) => (x.id === v.id ? { ...x, status: a.status } : x)) };
          s = touch(s, "youtube");
          summaries.push('YouTube "' + v.title.slice(0, 30) + '" -> ' + a.status);
        }
        break;
      }
      case "mechanic_phase":
        s = { ...s, mechanicProject: { ...s.mechanicProject, phase: a.phase } };
        s = touch(s, "mechanic");
        summaries.push("Mechanic AIOS phase -> " + a.phase);
        break;
      case "mechanic_discovery_done":
        s = { ...s, mechanicProject: { ...s.mechanicProject, discoveryDone: true } };
        s = touch(s, "mechanic");
        summaries.push("Mechanic discovery call marked done");
        break;
      case "mechanic_feature_done": {
        const f = fuzzyMatch(s.mechanicProject.features, a.matchText, (x) => x.text);
        if (f) {
          s = {
            ...s,
            mechanicProject: {
              ...s.mechanicProject,
              features: s.mechanicProject.features.map((x) => (x.id === f.id ? { ...x, done: true } : x)),
            },
          };
          s = touch(s, "mechanic");
          summaries.push("Mechanic feature done: " + f.text);
        }
        break;
      }
      case "mechanic_note":
        s = {
          ...s,
          mechanicProject: {
            ...s.mechanicProject,
            notes: s.mechanicProject.notes ? s.mechanicProject.notes + "\n" + a.text : a.text,
          },
        };
        s = touch(s, "mechanic");
        summaries.push("Mechanic note added");
        break;
      case "cash_entry":
        s = { ...s, cashflow: { ...s.cashflow, entries: [...s.cashflow.entries, { id: "e" + Date.now() + Math.random(), label: a.label, amount: a.amount }] } };
        s = touch(s, "cashflow");
        summaries.push("Cashflow +$" + a.amount + " (" + a.label + ")");
        break;
      case "client_add":
        s = { ...s, clients: [...s.clients, { id: "c" + Date.now() + Math.random(), name: a.name, amount: a.amount }] };
        s = touch(s, "cashflow");
        summaries.push("New recurring client: " + a.name + " $" + a.amount + "/mo");
        break;
      default:
        break;
    }
  }

  if (summaries.length) {
    s.activityLog = summaries.reduce((log, msg) => pushLog({ ...s, activityLog: log }, msg), s.activityLog || []);
  }
  return { newState: s, summaries };
}

/* ============================== EXPORT / IMPORT ============================== */
function exportData(state) {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = "operator-dashboard-backup-" + stamp + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importData(file, onSuccess, onError) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      onSuccess(parsed);
    } catch (err) {
      onError("That file doesn't look like a valid backup.");
    }
  };
  reader.onerror = () => onError("Couldn't read that file.");
  reader.readAsText(file);
}

/* ============================== SMALL UI ATOMS ============================== */
function Pill({ children, tone }) {
  tone = tone || "stone";
  const tones = {
    stone: "bg-stone-100 text-stone-600",
    amber: "bg-amber-100 text-amber-700",
    green: "bg-emerald-100 text-emerald-700",
    blue: "bg-blue-100 text-blue-700",
    red: "bg-rose-100 text-rose-700",
  };
  return <span className={"text-[11px] font-medium px-2 py-0.5 rounded-full " + tones[tone]}>{children}</span>;
}

function StatTile({ label, value, accent }) {
  return (
    <div className="bg-white rounded-xl border border-stone-200 px-3 py-2.5">
      <p className="text-[9px] font-semibold text-stone-400 uppercase tracking-wide mb-0.5">{label}</p>
      <p className="text-[17px] font-bold leading-none" style={{ color: accent }}>{value}</p>
    </div>
  );
}

function QueueRow({ left, value, onChange, status, statusMap, onCycle, onRemove }) {
  const pair = statusMap[status];
  const label = pair[0], tone = pair[1];
  return (
    <div className="flex items-center gap-2 group">
      {left}
      <input
        value={value}
        onChange={(e) => onChange(e.target.value)}
        className="flex-1 text-[13px] bg-transparent border-b border-stone-100 focus:border-stone-300 outline-none py-1.5 text-stone-800 min-w-0"
      />
      <button onClick={onCycle} className="shrink-0">
        <Pill tone={tone}>{label}</Pill>
      </button>
      <button onClick={onRemove} className="shrink-0 text-stone-300 hover:text-rose-500 opacity-60 group-hover:opacity-100 transition-opacity">
        <Trash2 size={13} />
      </button>
    </div>
  );
}

/* ============================== AI UPDATE BAR ============================== */
function AIUpdateBar({ onApply }) {
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [lastResult, setLastResult] = useState(null);

  const submit = async () => {
    if (!text.trim() || busy) return;
    setBusy(true);
    setError(null);
    setLastResult(null);
    try {
      const parsed = await parseUpdateWithClaude(text.trim());
      const actions = parsed.actions || [];
      if (actions.length === 0) {
        setError("Didn't catch anything actionable in that, try being more specific.");
      } else {
        const summaries = onApply(actions);
        setLastResult(summaries);
        setText("");
      }
    } catch (e) {
      setError("Couldn't reach Claude, try again.");
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="bg-gradient-to-br from-stone-900 to-stone-800 rounded-2xl p-4 shadow-lg">
      <div className="flex items-center gap-2 mb-2.5">
        <Sparkles size={14} className="text-amber-300" />
        <p className="text-[12px] font-semibold text-white">Tell the dashboard what happened</p>
      </div>
      <div className="flex gap-2">
        <input
          value={text}
          onChange={(e) => setText(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && submit()}
          placeholder="e.g. closed mechanic site $600, posted the LinkedIn intro, gym done, energy 7"
          disabled={busy}
          className="flex-1 text-[13px] bg-white/10 placeholder-stone-400 text-white rounded-xl px-3.5 py-2.5 outline-none focus:bg-white/15 transition-colors disabled:opacity-50"
        />
        <button
          onClick={submit}
          disabled={busy || !text.trim()}
          className="shrink-0 w-10 h-10 rounded-xl bg-white/15 hover:bg-white/25 disabled:opacity-40 flex items-center justify-center transition-colors"
        >
          {busy ? <Loader2 size={16} className="text-white animate-spin" /> : <Send size={15} className="text-white" />}
        </button>
      </div>
      {error && (
        <div className="flex items-center gap-1.5 mt-2 text-[11px] text-amber-300">
          <AlertCircle size={12} /> {error}
        </div>
      )}
      {lastResult && lastResult.length > 0 && (
        <div className="mt-2.5 space-y-1">
          {lastResult.map((s, i) => (
            <div key={i} className="flex items-center gap-1.5 text-[11px] text-emerald-300">
              <CheckCircle2 size={11} /> {s}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ============================== BACKUP BAR ============================== */
function BackupBar({ state, setState, update }) {
  const fileInputRef = useRef(null);
  const [msg, setMsg] = useState(null);

  const handleExport = () => {
    exportData(state);
    setMsg({ type: "ok", text: "Backup downloaded" });
    setTimeout(() => setMsg(null), 2500);
  };

  const handleImportClick = () => fileInputRef.current && fileInputRef.current.click();

  const handleFileChange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    importData(
      file,
      (parsed) => {
        const merged = { ...defaultState, ...parsed };
        setState(merged);
        saveToLocalStorage(merged);
        setMsg({ type: "ok", text: "Backup restored" });
        setTimeout(() => setMsg(null), 2500);
      },
      (errText) => {
        setMsg({ type: "err", text: errText });
        setTimeout(() => setMsg(null), 3000);
      }
    );
    e.target.value = "";
  };

  return (
    <div className="flex items-center gap-2 flex-wrap">
      <button
        onClick={handleExport}
        className="flex items-center gap-1.5 text-[11px] font-medium px-3 py-1.5 rounded-lg bg-white border border-stone-200 text-stone-600 hover:bg-stone-50"
      >
        <Download size={12} /> Backup
      </button>
      <button
        onClick={handleImportClick}
        className="flex items-center gap-1.5 text-[11px] font-medium px-3 py-1.5 rounded-lg bg-white border border-stone-200 text-stone-600 hover:bg-stone-50"
      >
        <Upload size={12} /> Restore
      </button>
      <input ref={fileInputRef} type="file" accept="application/json" onChange={handleFileChange} className="hidden" />
      {msg && (
        <span className={"text-[11px] font-medium " + (msg.type === "ok" ? "text-emerald-600" : "text-rose-600")}>
          {msg.text}
        </span>
      )}
    </div>
  );
}

function OverviewPanel(props) {

          </div>
        </div>
        <div className="bg-white rounded-xl border border-stone-200 px-3.5 py-3 flex items-center gap-2.5">

function ContentPanel({ state, update }) {
  const cycleLi = (id) =>
    update((s) => {
      const order = ["queued", "drafted", "posted"];
      const p = s.linkedinQueue.find((x) => x.id === id);
      const next = order[(order.indexOf(p.status) + 1) % order.length];
      let ns = { ...s, linkedinQueue: s.linkedinQueue.map((x) => (x.id === id ? { ...x, status: next } : x)) };
      ns = touch(ns, "linkedin");
      ns.activityLog = pushLog(ns, 'LinkedIn "' + p.topic.slice(0, 30) + '" -> ' + next);
      return ns;
    });
  const editLi = (id, topic) => update((s) => ({ ...s, linkedinQueue: s.linkedinQueue.map((p) => (p.id === id ? { ...p, topic } : p)) }));
  const removeLi = (id) => update((s) => ({ ...s, linkedinQueue: s.linkedinQueue.filter((p) => p.id !== id) }));
  const addLi = () =>
    update((s) => ({ ...s, linkedinQueue: [...s.linkedinQueue, { id: "li" + Date.now(), week: "-", day: "-", topic: "New post idea", status: "queued" }] }));

  const cycleYt = (id) =>
    update((s) => {
      const order = ["planned", "filmed", "live"];
      const v = s.youtubeQueue.find((x) => x.id === id);
      const next = order[(order.indexOf(v.status) + 1) % order.length];
      let ns = { ...s, youtubeQueue: s.youtubeQueue.map((x) => (x.id === id ? { ...x, status: next } : x)) };
      ns = touch(ns, "youtube");
      ns.activityLog = pushLog(ns, 'YouTube "' + v.title.slice(0, 30) + '" -> ' + next);
      return ns;
    });
  const editYt = (id, title) => update((s) => ({ ...s, youtubeQueue: s.youtubeQueue.map((v) => (v.id === id ? { ...v, title } : v)) }));
  const removeYt = (id) => update((s) => ({ ...s, youtubeQueue: s.youtubeQueue.filter((v) => v.id !== id) }));
  const addYt = () =>
    update((s) => ({ ...s, youtubeQueue: [...s.youtubeQueue, { id: "yt" + Date.now(), week: "-", title: "New video idea", status: "planned" }] }));

  return (
    <div className="space-y-5">
      <div>
        <div className="flex items-center justify-between mb-2.5">
          <div className="flex items-center gap-2">
            <Linkedin size={15} className="text-[#0077B5]" />
            <p className="text-[13px] font-semibold text-stone-800">LinkedIn</p>
          </div>
          <span className="text-[10px] text-stone-400">{timeAgo(state.lastUpdated && state.lastUpdated.linkedin)}</span>
        </div>
        <div className="space-y-2">
          {state.linkedinQueue.map((p) => (
            <QueueRow
              key={p.id}
              left={<span className="text-[10px] text-stone-400 font-mono w-11 shrink-0">Wk{p.week} {p.day}</span>}
              value={p.topic}
              onChange={(v) => editLi(p.id, v)}
              status={p.status}
              statusMap={{ queued: ["queued", "stone"], drafted: ["drafted", "amber"], posted: ["posted", "green"] }}
              onCycle={() => cycleLi(p.id)}
              onRemove={() => removeLi(p.id)}
            />
          ))}
          <button onClick={addLi} className="flex items-center gap-1.5 text-[12px] font-medium text-stone-400 hover:text-stone-600 pt-1">
            <Plus size={13} /> Add post
          </button>
        </div>
      </div>

      <div className="pt-4 border-t border-stone-100">
        <div className="flex items-center justify-between mb-2.5">
          <div className="flex items-center gap-2">
            <Youtube size={15} className="text-[#CC0000]" />
            <p className="text-[13px] font-semibold text-stone-800">YouTube</p>
          </div>
          <span className="text-[10px] text-stone-400">{timeAgo(state.lastUpdated && state.lastUpdated.youtube)}</span>
        </div>
        <div className="space-y-2">
          {state.youtubeQueue.map((v) => (
            <QueueRow
              key={v.id}
              left={<span className="text-[10px] text-stone-400 font-mono w-11 shrink-0">Wk{v.week}</span>}
              value={v.title}
              onChange={(val) => editYt(v.id, val)}
              status={v.status}
              statusMap={{ planned: ["planned", "stone"], filmed: ["filmed", "amber"], live: ["live", "green"] }}
              onCycle={() => cycleYt(v.id)}
              onRemove={() => removeYt(v.id)}
            />
          ))}
          <button onClick={addYt} className="flex items-center gap-1.5 text-[12px] font-medium text-stone-400 hover:text-stone-600 pt-1">
            <Plus size={13} /> Add video

    </div>
  );
}

function MechanicPanel({ state, update }) {
  const toggleFeature = (id) =>
    update((s) => {
      const f = s.mechanicProject.features.find((x) => x.id === id);
      const nowDone = !f.done;
      let ns = { ...s, mechanicProject: { ...s.mechanicProject, features: s.mechanicProject.features.map((x) => (x.id === id ? { ...x, done: nowDone } : x)) } };
      ns = touch(ns, "mechanic");
      ns.activityLog = pushLog(ns, 'Mechanic feature "' + f.text + '" -> ' + (nowDone ? "done" : "not done"));
      return ns;
    });
  const setNotes = (notes) => update((s) => touch({ ...s, mechanicProject: { ...s.mechanicProject, notes } }, "mechanic"));
  const setPhase = (phase) =>
    update((s) => {
      let ns = touch({ ...s, mechanicProject: { ...s.mechanicProject, phase } }, "mechanic");
      ns.activityLog = pushLog(ns, "Mechanic AIOS phase -> " + phase);
      return ns;
    });
  const toggleDiscovery = () =>
    update((s) => {
      const nowDone = !s.mechanicProject.discoveryDone;
      let ns = touch({ ...s, mechanicProject: { ...s.mechanicProject, discoveryDone: nowDone } }, "mechanic");
      ns.activityLog = pushLog(ns, "Mechanic discovery call -> " + (nowDone ? "done" : "not done"));
      return ns;
    });

  const featuresDone = state.mechanicProject.features.filter((f) => f.done).length;

  return (
    <div className="space-y-5">
      <div className="flex items-center justify-between">
        <p className="text-[11px] font-semibold text-stone-400 uppercase tracking-wide">Phase</p>
        <span className="text-[10px] text-stone-400">{timeAgo(state.lastUpdated && state.lastUpdated.mechanic)}</span>
      </div>
      <div className="flex items-center gap-1.5 flex-wrap">
        {["discovery", "scoping", "building", "pilot", "live"].map((p) => (
          <button
            key={p}
            onClick={() => setPhase(p)}
            className="text-[11px] font-medium px-2.5 py-1.5 rounded-full capitalize transition-colors"
            style={{ backgroundColor: state.mechanicProject.phase === p ? "#7F77DD" : "#f5f5f4", color: state.mechanicProject.phase === p ? "white" : "#78716c" }}
          >
            {p}
          </button>
        ))}
      </div>

      <button onClick={toggleDiscovery} className="flex items-center gap-2.5 w-full px-3.5 py-3 rounded-xl border border-stone-200 hover:bg-stone-50 transition-colors">
        {state.mechanicProject.discoveryDone ? <CheckCircle2 size={17} className="text-emerald-600" /> : <Circle size={17} className="text-stone-300" />}
        <span className="text-[13px] font-medium text-stone-700">Discovery conversation completed</span>
      </button>

      <div>
        <p className="text-[11px] font-semibold text-stone-400 uppercase tracking-wide mb-2">MVP feature checklist — {featuresDone}/{state.mechanicProject.features.length}</p>
        <div className="space-y-1.5">
          {state.mechanicProject.features.map((f) => (
            <button key={f.id} onClick={() => toggleFeature(f.id)} className="flex items-center gap-2.5 w-full text-left py-1.5">
              {f.done ? <CheckCircle2 size={17} className="text-emerald-600 shrink-0" /> : <Circle size={17} className="text-stone-300 shrink-0" />}
              <span className={"text-[13px] " + (f.done ? "text-stone-400 line-through" : "text-stone-700")}>{f.text}</span>
            </button>
          ))}
        </div>
      </div>

      <div>
        <p className="text-[11px] font-semibold text-stone-400 uppercase tracking-wide mb-1.5">Notes</p>
        <textarea
          value={state.mechanicProject.notes}
          onChange={(e) => setNotes(e.target.value)}
          placeholder="Discovery notes, decisions, blockers…"
          rows={4}
          className="w-full text-[13px] bg-stone-50 rounded-lg px-3 py-2.5 border border-stone-200 focus:border-stone-400 outline-none text-stone-800 resize-none"
        />
      </div>
    </div>
  );
}

function CashflowPanel({ state, update }) {
  const [newClientName, setNewClientName] = useState("");
  const [newClientAmount, setNewClientAmount] = useState("");
  const [newCashEntry, setNewCashEntry] = useState({ label: "", amount: "" });

  const cashThisPeriod = state.cashflow.entries.reduce((s, e) => s + (Number(e.amount) || 0), 0);
  const cashPct = Math.min(100, Math.round((cashThisPeriod / state.cashflow.target) * 100));
  const mrr = state.clients.reduce((s, c) => s + (Number(c.amount) || 0), 0);

  const addCashEntry = () => {
    if (!newCashEntry.label.trim() || !newCashEntry.amount) return;
    update((s) => {
      let ns = { ...s, cashflow: { ...s.cashflow, entries: [...s.cashflow.entries, { id: "e" + Date.now(), ...newCashEntry }] } };
      ns = touch(ns, "cashflow");
      ns.activityLog = pushLog(ns, "Cashflow +$" + newCashEntry.amount + " (" + newCashEntry.label + ")");
      return ns;
    });
    setNewCashEntry({ label: "", amount: "" });
  };
  const removeCashEntry = (id) => update((s) => ({ ...s, cashflow: { ...s.cashflow, entries: s.cashflow.entries.filter((e) => e.id !== id) } }));
  const resetCashPeriod = () => update((s) => ({ ...s, cashflow: { ...s.cashflow, entries: [] } }));

  const addClient = () => {
    if (!newClientName.trim()) return;
    update((s) => {
      let ns = { ...s, clients: [...s.clients, { id: "c" + Date.now(), name: newClientName, amount: newClientAmount || 0 }] };
      ns = touch(ns, "cashflow");
      ns.activityLog = pushLog(ns, 'New recurring client "' + newClientName + '" $' + (newClientAmount || 0) + "/mo");
      return ns;
    });
    setNewClientName("");
    setNewClientAmount("");
  };
  const removeClient = (id) => update((s) => ({ ...s, clients: s.clients.filter((c) => c.id !== id) }));

  return (
    <div className="space-y-5">
      <div className="flex items-center justify-between">
        <p className="text-[11px] font-semibold text-stone-400 uppercase tracking-wide">This period</p>
        <span className="text-[10px] text-stone-400">{timeAgo(state.lastUpdated && state.lastUpdated.cashflow)}</span>
      </div>
      <div>
        <div className="flex items-center justify-between mb-1.5">
          <span className="text-[13px] font-semibold text-stone-700">${cashThisPeriod} / ${state.cashflow.target}</span>
          <span className="text-[12px] font-semibold text-stone-500">{cashPct}%</span>
        </div>
        <div className="h-2.5 bg-stone-100 rounded-full overflow-hidden">
          <div className="h-full rounded-full transition-all duration-500" style={{ width: cashPct + "%", backgroundColor: "#1D9E75" }} />
        </div>
      </div>

      <div className="space-y-1.5">
        {state.cashflow.entries.map((e) => (
          <div key={e.id} className="flex items-center gap-2 text-[13px] py-1">
            <span className="flex-1 text-stone-700">{e.label}</span>
            <span className="font-semibold text-emerald-700">${e.amount}</span>
            <button onClick={() => removeCashEntry(e.id)} className="text-stone-300 hover:text-rose-500"><X size={13} /></button>
          </div>
        ))}
      </div>

      <div className="flex gap-2">
        <input value={newCashEntry.label} onChange={(e) => setNewCashEntry((s) => ({ ...s, label: e.target.value }))} placeholder="e.g. Website — Joe's Auto" className="flex-1 text-[13px] bg-stone-50 rounded-lg px-3 py-2 border border-stone-200 focus:border-stone-400 outline-none min-w-0" />
        <input value={newCashEntry.amount} onChange={(e) => setNewCashEntry((s) => ({ ...s, amount: e.target.value }))} placeholder="$" className="w-16 text-[13px] bg-stone-50 rounded-lg px-2 py-2 border border-stone-200 focus:border-stone-400 outline-none" />
        <button onClick={addCashEntry} className="px-3 rounded-lg bg-stone-900 text-white text-[12px] font-medium hover:bg-stone-700 shrink-0">Add</button>
      </div>
      <button onClick={resetCashPeriod} className="text-[11px] text-stone-400 hover:text-stone-600">Reset period</button>

      <div className="pt-3 border-t border-stone-100">
        <p className="text-[11px] font-semibold text-stone-400 uppercase tracking-wide mb-2 flex items-center gap-1.5">
          <TrendingUp size={12} /> Recurring clients — ${mrr}/mo
        </p>
        <div className="space-y-1.5 mb-2">
          {state.clients.map((c) => (
            <div key={c.id} className="flex items-center gap-2 text-[13px] py-1">
              <span className="flex-1 text-stone-700">{c.name}</span>
              <span className="font-semibold text-stone-700">${c.amount}/mo</span>
              <button onClick={() => removeClient(c.id)} className="text-stone-300 hover:text-rose-500"><X size={13} /></button>
            </div>
          ))}
        </div>
        <div className="flex gap-2">
          <input value={newClientName} onChange={(e) => setNewClientName(e.target.value)} placeholder="Client name" className="flex-1 text-[13px] bg-stone-50 rounded-lg px-3 py-2 border border-stone-200 focus:border-stone-400 outline-none min-w-0" />
          <input value={newClientAmount} onChange={(e) => setNewClientAmount(e.target.value)} placeholder="$/mo" className="w-16 text-[13px] bg-stone-50 rounded-lg px-2 py-2 border border-stone-200 focus:border-stone-400 outline-none" />
          <button onClick={addClient} className="px-3 rounded-lg bg-stone-900 text-white text-[12px] font-medium hover:bg-stone-700 shrink-0">Add</button>
        </div>
      </div>
    </div>
  );
}

  { id: "overview", label: "Overview", icon: LayoutGrid, accent: "#44403c" },
  { id: "today", label: "Today", icon: Sun, accent: "#BA7517" },
  { id: "content", label: "Content", icon: Linkedin, accent: "#0077B5" },

function OperatorDashboard() {
  const { state, update, setState, loaded, saving } = useDashboardState();
  const [tab, setTab] = useState("overview");

  if (!loaded) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-stone-50">
        <div className="text-stone-400 text-sm">Loading dashboard…</div>
      </div>
    );
  }

  const today = new Date();
  const dayName = today.toLocaleDateString("en-US", { weekday: "long" });
  const dateStr = today.toLocaleDateString("en-US", { month: "long", day: "numeric" });

  const mrr = state.clients.reduce((sum, c) => sum + (Number(c.amount) || 0), 0);
  const cashThisPeriod = state.cashflow.entries.reduce((s, e) => s + (Number(e.amount) || 0), 0);
  const cashPct = Math.min(100, Math.round((cashThisPeriod / state.cashflow.target) * 100));
  const featuresDone = state.mechanicProject.features.filter((f) => f.done).length;
  const featuresTotal = state.mechanicProject.features.length;
  const liQueued = state.linkedinQueue.filter((p) => p.status === "queued").length;
  const liPosted = state.linkedinQueue.filter((p) => p.status === "posted").length;
  const ytPlanned = state.youtubeQueue.filter((v) => v.status === "planned").length;
  const ytLive = state.youtubeQueue.filter((v) => v.status === "live").length;

  const handleApply = (actions) => {
    let summaries = [];
    update((s) => {
      const result = applyActions(s, actions);
      summaries = result.summaries;
      return result.newState;
    });
    return summaries;
  };

  return (
    <div className="h-screen flex flex-col bg-stone-50" style={{ paddingTop: "env(safe-area-inset-top)", paddingBottom: "env(safe-area-inset-bottom)" }}>
      <div className="bg-stone-900 text-white px-4 sm:px-6 py-3.5 shrink-0">
        <div className="max-w-3xl mx-auto flex items-center justify-between">
          <div>
            <p className="text-stone-400 text-[10px] font-medium tracking-wide uppercase">{dayName}, {dateStr}</p>
            <h1 className="text-[17px] font-bold tracking-tight leading-tight">Operator Dashboard</h1>
          </div>
          <div className="flex items-center gap-1.5 text-stone-400 text-[11px]">
            <span className={"w-1.5 h-1.5 rounded-full " + (saving ? "bg-amber-400 animate-pulse" : "bg-emerald-400")} />
            {saving ? "saving…" : "saved on device"}
          </div>
        </div>
      </div>

      <div className="px-4 sm:px-6 pt-4 shrink-0">
        <div className="max-w-3xl mx-auto">
          <AIUpdateBar onApply={handleApply} />
        </div>
      </div>

      <div className="px-4 sm:px-6 pt-3 shrink-0">
        <div className="max-w-3xl mx-auto flex items-center justify-between gap-2 flex-wrap">
          <div className="flex gap-1 overflow-x-auto pb-1">
            {TABS.map((t) => {
              const Icon = t.icon;
              const active = tab === t.id;
              return (
                <button
                  key={t.id}
                  onClick={() => setTab(t.id)}
                  className="flex items-center gap-1.5 px-3 py-2 rounded-xl text-[12px] font-medium whitespace-nowrap transition-colors shrink-0"
                  style={{
                    backgroundColor: active ? t.accent : "white",
                    color: active ? "white" : "#57534e",
                    border: active ? "none" : "1px solid #e7e5e4",
                  }}
                >
                  <Icon size={13} />
                  {t.label}
                </button>
              );
            })}
          </div>
          <BackupBar state={state} setState={setState} update={update} />
        </div>
      </div>

      <div className="flex-1 overflow-y-auto px-4 sm:px-6 py-4">
        <div className="max-w-3xl mx-auto bg-white rounded-2xl border border-stone-200 p-4 sm:p-5">
          {tab === "overview" && (
            <OverviewPanel
              state={state} mrr={mrr} cashPct={cashPct}
              featuresDone={featuresDone} featuresTotal={featuresTotal}
              liQueued={liQueued} liPosted={liPosted} ytPlanned={ytPlanned} ytLive={ytLive}
            />
          )}
          {tab === "today" && <TodayPanel state={state} update={update} />}
          {tab === "content" && <ContentPanel state={state} update={update} />}
          {tab === "mechanic" && <MechanicPanel state={state} update={update} />}
          {tab === "cashflow" && <CashflowPanel state={state} update={update} />}
        </div>
        <div className="max-w-3xl mx-auto flex items-center justify-center gap-1.5 pt-3 pb-4">
          <ShieldCheck size={11} className="text-stone-300" />
          <p className="text-[10px] text-stone-400">
            Saved on this device only · back up weekly with the Backup button above
          </p>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<OperatorDashboard />);
</script>
</body>
</html>
