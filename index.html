const DollarSign=({size,className})=>e(Svg,{size,className},[line(12,2,12,22,'l'),path('M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6','p')]);

/* ── storage ── */
const KEY='operator-dashboard-state-v3';
function todayStr(){return new Date().toISOString().slice(0,10);}
function timeAgo(iso){
  if(!iso)return'never';
  const d=Date.now()-new Date(iso).getTime(),m=Math.floor(d/60000);
  if(m<1)return'just now';if(m<60)return m+'m ago';
  const h=Math.floor(m/60);if(h<24)return h+'h ago';
  return Math.floor(h/24)+'d ago';
}
function pushLog(state,message){
  const entry={id:'log'+Date.now()+Math.random(),message,ts:new Date().toISOString()};
  return[entry,...(state.activityLog||[])].slice(0,60);
}
function touch(state,section){
  return{...state,lastUpdated:{...(state.lastUpdated||{}),[section]:new Date().toISOString()}};
}
function loadLS(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function saveLS(s){try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}}

const DEF={
  date:todayStr(),energy:null,gymDone:false,wins:['','',''],
  mits:[{id:'m1',text:'',done:false},{id:'m2',text:'',done:false},{id:'m3',text:'',done:false}],
  linkedinQueue:[
    {id:'li1',week:1,day:'Tue',topic:'Intro post — the 8 week plan',status:'queued'},
    {id:'li2',week:1,day:'Thu',topic:'Problem post — missed calls cost local businesses',status:'queued'},
    {id:'li3',week:2,day:'Tue',topic:'Lesson post — first 20 cold calls',status:'queued'},
    {id:'li4',week:2,day:'Thu',topic:'Demo video — MCTB in action',status:'queued'},
  ],
  youtubeQueue:[
    {id:'yt1',week:4,title:'I Am Building an AI Agency From Zero — Week 1',status:'planned'},
    {id:'yt2',week:5,title:'How I Set Up a Missed Call Text Back in n8n — Full Demo',status:'planned'},
    {id:'yt3',week:6,title:'I Discovered My First AIOS Client — A Mechanic Shop',status:'planned'},
  ],
  mechanicProject:{phase:'discovery',discoveryDone:false,notes:'',features:[
    {id:'f1',text:'MCTB intake (n8n + Twilio)',done:true},
    {id:'f2',text:'Booking dashboard / job cards',done:false},
    {id:'f3',text:'Customer profile + vehicle history',done:false},
    {id:'f4',text:'Multi-supplier parts search dashboard',done:false},
    {id:'f5',text:'Invoice generator',done:false},
    {id:'f6',text:'Review follow-up agent',done:false},
  ]},
  cashflow:{target:1000,entries:[]},clients:[],
  lastUpdated:{today:null,linkedin:null,youtube:null,mechanic:null,cashflow:null},
  activityLog:[],
};

function useDashboard(){
  const[state,setState]=useState(DEF);
  const[loaded,setLoaded]=useState(false);
  const[saving,setSaving]=useState(false);

  useEffect(()=>{
    const parsed=loadLS();
    if(parsed){
      let m={...DEF,...parsed};
      if(m.date!==todayStr()){
        m={...m,date:todayStr(),energy:null,gymDone:false,wins:['','',''],
          mits:[{id:'m1',text:'',done:false},{id:'m2',text:'',done:false},{id:'m3',text:'',done:false}]};
      }
      setState(m);
    }
    setLoaded(true);
  },[]);

  const update=useCallback((updater)=>{
    setState(prev=>{
      const next=typeof updater==='function'?updater(prev):updater;
      setSaving(true);
      saveLS(next);
      setTimeout(()=>setSaving(false),300);
      return next;
    });
  },[]);

  return{state,update,setState,loaded,saving};
}

/* ── AI parser ── */
const SYS="You are a state-update parser for a personal operator dashboard. Return ONLY valid JSON with an actions array. Shapes: {type:mit_add,text},{type:mit_done,matchText},{type:gym_done},{type:energy,value},{type:win_add,text},{type:linkedin_add,topic,week,day},{type:linkedin_status,matchText,status(queued/drafted/posted)},{type:youtube_add,title,week},{type:youtube_status,matchText,status(planned/filmed/live)},{type:mechanic_phase,phase},{type:mechanic_discovery_done},{type:mechanic_feature_done,matchText},{type:mechanic_note,text},{type:cash_entry,label,amount},{type:client_add,name,amount}. Only emit actions clearly supported by the text. Output JSON only, no markdown.";

async function parseAI(text){
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,system:SYS,messages:[{role:'user',content:text}]})
    });
    const d=await r.json();
    let raw=(d.content||[]).map(b=>b.type==='text'?b.text:'').join('').trim().replace(/^```json\s*/i,'').replace(/^```\s*/i,'').replace(/```\s*$/i,'');
    return JSON.parse(raw);
  }catch(e){return{actions:[]};}
}

function fuzzy(items,needle,get){
  if(!needle)return null;
  const n=needle.toLowerCase();
  return items.find(i=>get(i).toLowerCase().includes(n))||null;
}

function applyActions(state,actions){
  let s={...state};const sums=[];
  for(const a of actions){
    switch(a.type){
      case'mit_add':{const sl=s.mits.find(m=>!m.text.trim());if(sl){s={...s,mits:s.mits.map(m=>m.id===sl.id?{...m,text:a.text}:m)};sums.push('MIT added: '+a.text);}break;}
      case'mit_done':{const m=fuzzy(s.mits,a.matchText,x=>x.text);if(m){s={...s,mits:s.mits.map(x=>x.id===m.id?{...x,done:true}:x)};sums.push('MIT done: '+m.text);}break;}
      case'gym_done':s={...s,gymDone:true};sums.push('Gym done');break;
      case'energy':s={...s,energy:a.value};sums.push('Energy: '+a.value);break;
      case'win_add':{const i=s.wins.findIndex(w=>!w.trim());if(i!==-1){s={...s,wins:s.wins.map((w,j)=>j===i?a.text:w)};sums.push('Win: '+a.text);}break;}
      case'linkedin_add':s=touch({...s,linkedinQueue:[...s.linkedinQueue,{id:'li'+Date.now(),week:a.week||'-',day:a.day||'-',topic:a.topic,status:'queued'}]},'linkedin');sums.push('LinkedIn queued: '+a.topic);break;
      case'linkedin_status':{const p=fuzzy(s.linkedinQueue,a.matchText,x=>x.topic);if(p){s=touch({...s,linkedinQueue:s.linkedinQueue.map(x=>x.id===p.id?{...x,status:a.status}:x)},'linkedin');sums.push('LinkedIn "'+p.topic.slice(0,25)+'" → '+a.status);}break;}
      case'youtube_add':s=touch({...s,youtubeQueue:[...s.youtubeQueue,{id:'yt'+Date.now(),week:a.week||'-',title:a.title,status:'planned'}]},'youtube');sums.push('YouTube planned: '+a.title);break;
      case'youtube_status':{const v=fuzzy(s.youtubeQueue,a.matchText,x=>x.title);if(v){s=touch({...s,youtubeQueue:s.youtubeQueue.map(x=>x.id===v.id?{...x,status:a.status}:x)},'youtube');sums.push('YouTube → '+a.status);}break;}
      case'mechanic_phase':s=touch({...s,mechanicProject:{...s.mechanicProject,phase:a.phase}},'mechanic');sums.push('Mechanic phase → '+a.phase);break;
      case'mechanic_discovery_done':s=touch({...s,mechanicProject:{...s.mechanicProject,discoveryDone:true}},'mechanic');sums.push('Discovery done');break;
      case'mechanic_feature_done':{const f=fuzzy(s.mechanicProject.features,a.matchText,x=>x.text);if(f){s=touch({...s,mechanicProject:{...s.mechanicProject,features:s.mechanicProject.features.map(x=>x.id===f.id?{...x,done:true}:x)}},'mechanic');sums.push('Feature done: '+f.text);}break;}
      case'mechanic_note':s=touch({...s,mechanicProject:{...s.mechanicProject,notes:s.mechanicProject.notes?s.mechanicProject.notes+'\n'+a.text:a.text}},'mechanic');sums.push('Note added');break;
      case'cash_entry':s=touch({...s,cashflow:{...s.cashflow,entries:[...s.cashflow.entries,{id:'e'+Date.now(),label:a.label,amount:a.amount}]}},'cashflow');sums.push('Cash +$'+a.amount+' ('+a.label+')');break;
      case'client_add':s=touch({...s,clients:[...s.clients,{id:'c'+Date.now(),name:a.name,amount:a.amount}]},'cashflow');sums.push('Client: '+a.name+' $'+a.amount+'/mo');break;
    }
  }
  if(sums.length){s.activityLog=sums.reduce((log,msg)=>pushLog({...s,activityLog:log},msg),s.activityLog||[]);}
  return{newState:s,sums};
}

/* ── export/import ── */
function exportData(state){
  const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download='operator-backup-'+todayStr()+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);
}
function importData(file,onOk,onErr){
  const r=new FileReader();
  r.onload=ev=>{try{onOk(JSON.parse(ev.target.result));}catch(e){onErr('Invalid backup file.');}};
  r.onerror=()=>onErr('Could not read file.');
  r.readAsText(file);
}

/* ── UI helpers ── */
function pill(label,tone){
  const tones={stone:'background:#f1f0ef;color:#57534e',amber:'background:#fef3c7;color:#92400e',
    green:'background:#d1fae5;color:#065f46',blue:'background:#dbeafe;color:#1e40af',red:'background:#fee2e2;color:#991b1b'};
  return e('span',{style:{fontSize:11,fontWeight:500,padding:'2px 8px',borderRadius:20,...Object.fromEntries((tones[tone]||tones.stone).split(';').map(p=>p.split(':').map(s=>s.trim())).filter(a=>a.length===2).map(([k,v])=>[k.replace(/-([a-z])/g,(_,c)=>c.toUpperCase()),v]))}},label);
}
function stat(label,value,color){
  return e('div',{style:{background:'white',borderRadius:12,border:'1px solid #e7e5e4',padding:'10px 12px'}},
    e('p',{style:{fontSize:9,fontWeight:600,color:'#a8a29e',textTransform:'uppercase',letterSpacing:1,marginBottom:2}},label),
    e('p',{style:{fontSize:17,fontWeight:700,color,lineHeight:1}},value));
}

/* ── AI bar ── */
function AIBar({onApply}){
  const[text,setText]=useState('');
  const[busy,setBusy]=useState(false);
  const[err,setErr]=useState(null);
  const[res,setRes]=useState(null);

  const submit=async()=>{
    if(!text.trim()||busy)return;
    setBusy(true);setErr(null);setRes(null);
    try{
      const parsed=await parseAI(text.trim());
      const actions=parsed.actions||[];
      if(!actions.length){setErr("Didn't catch anything actionable — try being more specific.");}
      else{const sums=onApply(actions);setRes(sums);setText('');}
    }catch(ex){setErr('Could not reach Claude, try again.');}
    finally{setBusy(false);}
  };

  return e('div',{style:{background:'linear-gradient(135deg,#1c1917,#292524)',borderRadius:16,padding:16,marginBottom:12}},
    e('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:10}},
      e(Sparkles,{size:14,className:''}),
      e('p',{style:{fontSize:12,fontWeight:600,color:'white',margin:0}},'Tell the dashboard what happened')),
    e('div',{style:{display:'flex',gap:8}},
      e('input',{value:text,onChange:ev=>setText(ev.target.value),
        onKeyDown:ev=>ev.key==='Enter'&&submit(),disabled:busy,
        placeholder:'e.g. closed mechanic site $600, posted LinkedIn intro, gym done, energy 7',
        style:{flex:1,fontSize:13,background:'rgba(255,255,255,0.12)',color:'white',border:'none',
          borderRadius:12,padding:'10px 14px',outline:'none',opacity:busy?0.5:1}}),
      e('button',{onClick:submit,disabled:busy||!text.trim(),
        style:{width:40,height:40,borderRadius:12,background:'rgba(255,255,255,0.15)',border:'none',
          cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,opacity:(busy||!text.trim())?0.4:1}},
        busy?e(Loader2,{size:16,className:'animate-spin'}):e(Send,{size:15}))),
    err&&e('div',{style:{display:'flex',alignItems:'center',gap:6,marginTop:8,fontSize:11,color:'#fcd34d'}},
      e(AlertCircle,{size:12}),err),
    res&&res.length>0&&e('div',{style:{marginTop:10,display:'flex',flexDirection:'column',gap:4}},
      ...res.map((s,i)=>e('div',{key:i,style:{display:'flex',alignItems:'center',gap:6,fontSize:11,color:'#6ee7b7'}},
        e(CheckCircle2,{size:11}),s))));
}

/* ── backup bar ── */
function BackupBar({state,setState}){
  const ref=useRef(null);
  const[msg,setMsg]=useState(null);
  const bk=()=>{exportData(state);setMsg({ok:true,t:'Backup downloaded'});setTimeout(()=>setMsg(null),2500);};
  const imp=()=>ref.current&&ref.current.click();
  const chg=ev=>{
    const f=ev.target.files[0];if(!f)return;
    importData(f,parsed=>{const m={...DEF,...parsed};setState(m);saveLS(m);setMsg({ok:true,t:'Restored'});setTimeout(()=>setMsg(null),2500);},
      t=>{setMsg({ok:false,t});setTimeout(()=>setMsg(null),3000);});
    ev.target.value='';
  };
  return e('div',{style:{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}},
    e('button',{onClick:bk,style:{display:'flex',alignItems:'center',gap:5,fontSize:11,fontWeight:500,padding:'6px 10px',borderRadius:8,background:'white',border:'1px solid #e7e5e4',cursor:'pointer',color:'#57534e'}},e(Download,{size:12}),'Backup'),
    e('button',{onClick:imp,style:{display:'flex',alignItems:'center',gap:5,fontSize:11,fontWeight:500,padding:'6px 10px',borderRadius:8,background:'white',border:'1px solid #e7e5e4',cursor:'pointer',color:'#57534e'}},e(Upload,{size:12}),'Restore'),
    e('input',{ref,type:'file',accept:'application/json',onChange:chg,style:{display:'none'}}),
    msg&&e('span',{style:{fontSize:11,fontWeight:500,color:msg.ok?'#059669':'#dc2626'}},msg.t));
}

/* ── queue row ── */
function QueueRow({left,value,onChange,status,statusMap,onCycle,onRemove}){
  const[label,tone]=statusMap[status];
  return e('div',{style:{display:'flex',alignItems:'center',gap:8,padding:'4px 0',position:'relative'}},
    left,
    e('input',{value,onChange:ev=>onChange(ev.target.value),
      style:{flex:1,fontSize:13,background:'transparent',border:'none',borderBottom:'1px solid #e7e5e4',
        outline:'none',padding:'6px 0',color:'#1c1917',minWidth:0}}),
    e('button',{onClick:onCycle,style:{border:'none',background:'none',cursor:'pointer',flexShrink:0}},pill(label,tone)),
    e('button',{onClick:onRemove,style:{border:'none',background:'none',cursor:'pointer',flexShrink:0,color:'#d4d0cd',fontSize:13,lineHeight:1,padding:2}},e(Trash2,{size:13})));
}

/* ── Overview panel ── */
function OverviewPanel({state,mrr,cashPct,featuresDone,featuresTotal,liQueued,liPosted,ytPlanned,ytLive}){
  const mitsSet=state.mits.filter(m=>m.text.trim()).length;
  const mitsDone=state.mits.filter(m=>m.done&&m.text.trim()).length;
  const lu=state.lastUpdated||{};
  return e('div',{style:{display:'flex',flexDirection:'column',gap:16}},
    e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}},
      stat('MITs today',mitsDone+'/'+(mitsSet||3),'#7F77DD'),
      stat('MRR','$'+mrr,'#1D9E75'),
      stat('Cash goal',cashPct+'%','#D85A30'),
      stat('AIOS built',featuresDone+'/'+featuresTotal,'#378ADD')),
    e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}},
      e('div',{style:{background:'white',border:'1px solid #e7e5e4',borderRadius:12,padding:'10px 14px',display:'flex',alignItems:'center',gap:10}},
        e(Linkedin,{size:15,className:''}),

/* ── Tab bar ── */
const TABS=[
  {id:'overview',label:'Overview',Icon:LayoutGrid,accent:'#44403c'},
  {id:'today',label:'Today',Icon:Sun,accent:'#BA7517'},
  {id:'content',label:'Content',Icon:Linkedin,accent:'#0077B5'},
  {id:'mechanic',label:'Mechanic AIOS',Icon:Wrench,accent:'#7F77DD'},
  {id:'cashflow',label:'Cashflow',Icon:DollarSign,accent:'#1D9E75'},
];

/* ── App ── */
function App(){
  const{state,update,setState,loaded,saving}=useDashboard();
  const[tab,setTab]=useState('overview');

  if(!loaded)return e('div',{style:{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}},
    e('p',{style:{color:'#a8a29e',fontSize:14}},'Loading…'));

  const mrr=state.clients.reduce((s,c)=>s+(Number(c.amount)||0),0);
  const total=state.cashflow.entries.reduce((s,en)=>s+(Number(en.amount)||0),0);
  const cashPct=Math.min(100,Math.round((total/state.cashflow.target)*100));
  const fd=state.mechanicProject.features.filter(f=>f.done).length;
  const ft=state.mechanicProject.features.length;
  const liQ=state.linkedinQueue.filter(p=>p.status==='queued').length;
  const liP=state.linkedinQueue.filter(p=>p.status==='posted').length;
  const ytPl=state.youtubeQueue.filter(v=>v.status==='planned').length;
  const ytLv=state.youtubeQueue.filter(v=>v.status==='live').length;

  const handleApply=(actions)=>{
    let sums=[];
    update(s=>{const{newState,sums:sm}=applyActions(s,actions);sums=sm;return newState;});
    return sums;
  };

  const today=new Date();
  const dn=today.toLocaleDateString('en-US',{weekday:'long'});
  const ds=today.toLocaleDateString('en-US',{month:'long',day:'numeric'});

  return e('div',{style:{height:'100vh',display:'flex',flexDirection:'column',background:'#fafaf9',paddingTop:'env(safe-area-inset-top)',paddingBottom:'env(safe-area-inset-bottom)'}},
    // header
    e('div',{style:{background:'#1c1917',color:'white',padding:'14px 16px',flexShrink:0}},
      e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
        e('div',null,
          e('p',{style:{fontSize:10,color:'#a8a29e',textTransform:'uppercase',letterSpacing:1,margin:'0 0 2px'}},dn+', '+ds),
          e('h1',{style:{fontSize:17,fontWeight:700,margin:0,letterSpacing:-0.3}},'Operator Dashboard')),
        e('div',{style:{display:'flex',alignItems:'center',gap:6,fontSize:11,color:'#a8a29e'}},
          e('span',{style:{width:6,height:6,borderRadius:'50%',background:saving?'#fbbf24':'#4ade80',display:'inline-block'}}),
          saving?'saving…':'saved'))),
    // AI bar
    e('div',{style:{padding:'12px 16px 0',flexShrink:0}},e(AIBar,{onApply:handleApply})),
    // tabs + backup
    e('div',{style:{padding:'10px 16px 0',flexShrink:0,display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,flexWrap:'wrap'}},
      e('div',{style:{display:'flex',gap:4,overflowX:'auto',paddingBottom:4}},
        ...TABS.map(t=>e('button',{key:t.id,onClick:()=>setTab(t.id),
          style:{display:'flex',alignItems:'center',gap:5,padding:'7px 10px',borderRadius:10,border:tab===t.id?'none':'1px solid #e7e5e4',
            background:tab===t.id?t.accent:'white',color:tab===t.id?'white':'#57534e',
            fontSize:11,fontWeight:500,cursor:'pointer',whiteSpace:'nowrap',flexShrink:0}},
          e(t.Icon,{size:12}),t.label))),
      e(BackupBar,{state,setState})),
    // panel
    e('div',{style:{flex:1,overflowY:'auto',padding:16}},
      e('div',{style:{background:'white',borderRadius:16,border:'1px solid #e7e5e4',padding:16,marginBottom:8}},
        tab==='overview'&&e(OverviewPanel,{state,mrr,cashPct,featuresDone:fd,featuresTotal:ft,liQueued:liQ,liPosted:liP,ytPlanned:ytPl,ytLive:ytLv}),
        tab==='today'&&e(TodayPanel,{state,update}),
        tab==='content'&&e(ContentPanel,{state,update}),
        tab==='mechanic'&&e(MechanicPanel,{state,update}),
        tab==='cashflow'&&e(CashflowPanel,{state,update})),
      e('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',gap:6,paddingBottom:8}},
        e(ShieldCheck,{size:11,className:''}),
        e('p',{style:{fontSize:10,color:'#a8a29e',margin:0}},'Saved on device · back up weekly with the Backup button'))));
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(e(App,null));
</script>
